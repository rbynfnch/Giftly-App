<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Oct 1 - Dec 31 swaps in the red/green Christmas icon for the tab
      // favicon and iOS "Add to Home Screen" icon. Runs on every load (the
      // visitor's own clock), so unlike the installed PWA icon below, this
      // one needs no redeploy to flip on the day.
      if (new Date().getMonth() >= 9) {
        document.querySelector('link[rel="icon"]').href = '/favicon-christmas.png'
        document.querySelector('link[rel="apple-touch-icon"]').href = '/apple-touch-icon-christmas.png'
      }
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4d7c5f" />
    <title>Giftly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
